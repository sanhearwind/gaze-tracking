name: CI

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify runtime imports
        run: python -c "import cv2, mediapipe, numpy; import gaze_tracking_v2.app; print('Runtime imports OK')"

      - name: Run offline evaluator tests
        run: python -m unittest discover -s evaluation -p "test_*.py" -v

      - name: Parse Python sources
        run: >-
          python -c "import ast, pathlib; files=[p for p in pathlib.Path('.').rglob('*.py') if '__pycache__' not in str(p)]; [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in files]; print('AST parse ok:', len(files), 'files')"
